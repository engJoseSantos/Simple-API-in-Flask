<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crypto API – Contact</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 12px;
            background: #0d6efd;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0b5ed7;
        }

        .msg {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

<div class="card">
    <h1>📩 Contact</h1>

    <form id="contactForm">
        <label>Name</label>
        <input type="text" id="name" required>

        <label>Email</label>
        <input type="email" id="email" required>

        <label>Message</label>
        <textarea id="message" required></textarea>

        <button type="submit">Send Message</button>
    </form>

    <div id="response" class="msg"></div>
</div>

<script>
    const form = document.getElementById("contactForm");
    const responseBox = document.getElementById("response");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        responseBox.textContent = "Sending...";
        responseBox.className = "msg";

        const data = {
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            message: document.getElementById("message").value
        };

        try {
            const res = await fetch("/contact", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await res.json();

            if (res.ok) {
                responseBox.textContent = result.message;
                responseBox.classList.add("success");
                form.reset();
            } else {
                responseBox.textContent = result.error || "Error";
                responseBox.classList.add("error");
            }
        } catch (err) {
            responseBox.textContent = "Server error";
            responseBox.classList.add("error");
        }
    });
</script>

</body>
</html>
